name: 'Packages Split'

on:
    push:
        branches:
            - 4.x
            - 4.0
            - 4.x-gitsplit
        tags:
            - '*'

env:
    # 1. for Github split
    GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
    packages_split:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # define package to repository map
                package:
                    -
                        local_path: 'app'
                        split_repository: 'core-lib'

        steps:
            -   uses: actions/checkout@v2

            # no tag
            -
                if: "!startsWith(github.ref, 'refs/tags/')"
                uses: "symplify/monorepo-split-github-action@2.1"
                with:
                    # ↓ split "mautic/app" directory
                    package_directory: '${{ matrix.package.local_path }}'

                    # ↓ into https://github.com/nickveenhof/core-lib repository
                    repository_organization: 'nickveenhof'
                    repository_name: '${{ matrix.package.split_repository }}'

                    # ↓ the user signed under the split commit
                    user_name: "mautic-ci"
                    user_email: "gitsplit@mautic.org"

            # with tag
            -
                if: "startsWith(github.ref, 'refs/tags/')"
                uses: "symplify/monorepo-split-github-action@2.1"
                with:
                    tag: ${GITHUB_REF#refs/tags/}

                    # ↓ split "mautic/app" directory
                    package_directory: '${{ matrix.package.local_path }}'

                    # ↓ into https://github.com/nickveenhof/core-lib repository
                    repository_organization: 'nickveenhof'
                    repository_name: '${{ matrix.package.split_repository }}'

                    # ↓ the user signed under the split commit
                    user_name: "mautic-ci"
                    user_email: "gitsplit@mautic.org"
